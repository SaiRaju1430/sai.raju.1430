name: campuskart
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Supabase, Google Sign-In & OneSignal dependencies
  supabase_flutter: ^2.8.0
  google_sign_in: ^6.2.1
  onesignal_flutter: ^5.2.6

  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.3.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/demo_products/
    - assets/demo_fast_food/
